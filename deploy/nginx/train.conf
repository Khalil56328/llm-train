# LLM 训推平台 · 单机 Nginx 站点配置（宿主机直跑后端场景）
#
# 使用方式：复制到宿主机 Nginx 后加载
#   cp deploy/nginx/train.conf /etc/nginx/conf.d/train.conf
#   nginx -t && systemctl reload nginx
#
# 说明：
#   - 前端静态资源位于 /opt/llm-train/web（前端 dist 构建产物）
#   - /api、/static、/api/ws 反向代理到本机后端（127.0.0.1:8000）
#   - 若由后端 FastAPI 直接托管前端（FRONTEND_DIST_DIR），则本配置可省略

server {
    listen 80;
    server_name _;

    # 数据集/模型等大文件上传
    client_max_body_size 2g;

    # gzip
    gzip on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # 前端 SPA
    location / {
        root /opt/llm-train/web;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # REST API
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # 静态资源（评测报告 / 上传文件，由后端 StaticFiles 提供）
    location /static/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
    }

    # WebSocket（预留：训练实时日志 /api/ws/*）
    location /api/ws/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
    }
