# ============================================================
# LLM 训推平台 · Ubuntu 24.04 Nginx 站点配置（80 端口 → 后端 8000）
# 由 install_systemd.sh --with-nginx 安装到 /etc/nginx/sites-available/llm-train
#
# 说明：前端 SPA 由后端 FastAPI 直接托管（FRONTEND_DIST_DIR=../web-ui/dist），
#       Nginx 仅做反向代理 + WebSocket 升级 + 大文件上传支持。
# ============================================================
server {
    listen 80;
    server_name _;

    # 数据集/模型等大文件上传
    client_max_body_size 2g;

    # gzip
    gzip on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # 全部请求反代到后端（SPA / api / static 均由 FastAPI 处理）
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # WebSocket 实时日志（训练日志推送）
    location /api/ws/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
